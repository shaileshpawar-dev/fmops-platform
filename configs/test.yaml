# Test profile: tiny datasets, no tuning, deterministic, everything local.
environment: test
log_level: WARNING
log_format: console

data:
  train_rows: 1200
  random_seed: 7

validation:
  min_rows: 100

training:
  algorithm: hist_gradient_boosting
  cv_folds: 2

tuning:
  enabled: false
  max_trials: 2

approval:
  enabled: true
  min_f1: 0.30
  min_roc_auc: 0.55
  max_inference_latency_ms: 5000.0
  min_improvement: 0.001

deployment:
  provider: local
  strategy: direct
  endpoint_name: fmops-test

drift:
  enabled: true
  threshold: 0.20
  min_samples: 50
  detection_window: 200

monitoring:
  metrics_enabled: true

alerts:
  enabled: true
  sinks: [database]

retraining:
  enabled: true
  cooldown_minutes: 0
  min_new_samples: 50

llm:
  provider: mock
  model: mock-small

aws:
  enabled: false

tracking:
  backend: local
  registry_backend: local
  experiment_name: fmops-test

security:
  auth_backend: none
