<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMOps Platform — Console</title>
<style>
/* ---------------------------------------------------------------- tokens -- */
/* Light is the default and the designed-for case. Dark still works -- the
   viewer's own preference wins over ours -- but the palette below is the one
   the layout was built against. */
:root{
  --bg:#f7f8fa; --panel:#ffffff; --panel-2:#fafbfc; --raised:#ffffff;
  --ink:#111827; --ink-2:#4b5563; --ink-3:#6b7280; --ink-4:#9ca3af;
  --line:#e5e7eb; --line-2:#f0f2f5;
  --accent:#4f46e5; --accent-soft:#eef2ff; --accent-ink:#ffffff;
  --ok:#047857; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --bad:#b91c1c; --bad-bg:#fef2f2; --bad-line:#fecaca;
  --info:#1d4ed8; --info-bg:#eff6ff; --info-line:#bfdbfe;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 4px 16px rgba(16,24,40,.10);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sidebar:250px; --radius:8px;
}
/* Light is the default, deliberately, and it is not conditional on the
   viewer's OS setting: this console is designed light and should look the same
   on every machine it is demonstrated on. Dark remains a first-class option --
   the header toggle sets data-theme="dark" and the preference is remembered --
   it is simply opt-in rather than inherited. */
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --raised:#1a212b;
  --ink:#e6edf3; --ink-2:#9fabb9; --ink-3:#6e7d8d; --ink-4:#5a6673;
  --line:#262f3b; --line-2:#1e252f;
  --accent:#818cf8; --accent-soft:#1e1b4b; --accent-ink:#0d1117;
  --ok:#4ade80; --ok-bg:#0f2a1d; --ok-line:#14532d;
  --warn:#fbbf24; --warn-bg:#2b2412; --warn-line:#78350f;
  --bad:#f87171; --bad-bg:#2d1a18; --bad-line:#7f1d1d;
  --info:#60a5fa; --info-bg:#11243a; --info-line:#1e3a8a;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 4px 20px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
/* ---------------------------------------------------------------- layout -- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line)}
.brand b{font-size:14px;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.logo{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:12px;flex:none}
nav{padding:10px 8px 24px}
.navgrp{margin:14px 0 5px;padding:0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--ink-3);text-transform:uppercase}
.navlink{display:flex;align-items:center;gap:9px;padding:6.5px 10px;border-radius:var(--radius);
  color:var(--ink-2);cursor:pointer;font-weight:500;border:1px solid transparent}
.navlink:hover{background:var(--panel-2);color:var(--ink)}
.navlink.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlink:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);
  outline-offset:2px}
.navlink.on .ico{opacity:1}
.ico{width:15px;text-align:center;opacity:.75;font-size:12px;flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:0 22px;height:52px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.crumb{font-size:12px;color:var(--ink-3)}
.spacer{flex:1}
.content{padding:20px 22px 56px;max-width:1560px;width:100%}
.phead{margin-bottom:16px}
.phead h1{font-size:19px}
.phead p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px;max-width:70ch}
/* --------------------------------------------------------------- pieces --- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:var(--radius);cursor:pointer;
  font:inherit;font-weight:500;font-size:12px}
.btn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:16px;box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card>header h3{font-size:12.5px}
.card>header .sub{color:var(--ink-3);font-size:11.5px;font-weight:400}
.card .body{padding:14px}
.card .body.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1300px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:21px;font-weight:650;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--panel-2);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-line)}
.badge.bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.badge.info{background:var(--info-bg);color:var(--info);box-shadow:inset 0 0 0 1px var(--info-line)}
.badge.mute{background:var(--line-2);color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:7px 16px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.note{background:var(--info-bg);border:1px solid var(--info-line);
  border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--ink-2)}
.note b{color:var(--ink)}
.state{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.state .big{font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:4px;height:11px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.bar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar>i.bad{background:var(--bad)}.bar>i.ok{background:var(--ok)}.bar>i.warn{background:var(--warn)}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:10px 13px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.16);
  max-width:340px;animation:tin .18s ease}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(4,8,14,.55);display:grid;place-items:center;z-index:120;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:460px;width:100%}
.modal .box h3{font-size:14px}
input[type=text],input[type=password],select{width:100%;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:5px}
.cand{display:block;border:1px solid var(--line);border-radius:var(--radius);padding:12px;
  cursor:pointer;background:var(--panel-2);transition:border-color .12s,background .12s}
.cand:hover{border-color:var(--ink-4)}
.cand.on{border-color:var(--accent);background:var(--accent-soft)}
.step{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);
  padding:6px 11px;font-size:11.5px;font-weight:550;white-space:nowrap}
.step.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.step.done{border-color:var(--ok);color:var(--ok)}
.arw{color:var(--ink-3);font-size:11px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:550;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.burger{display:none}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:var(--sidebar);z-index:60;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .content{padding:16px 14px 48px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">FM</div>
      <div><b>FMOps Platform</b><small>OPERATIONS CONSOLE</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <button class="btn burger" id="burger" aria-label="Menu">☰</button>
      <span class="crumb" id="crumb">Overview</span>
      <span class="spacer"></span>
      <span id="envbadge"></span>
      <span id="healthbadge"></span>
      <button class="btn" id="refresh" title="Reload this page's data">↻ Refresh</button>
      <button class="btn" id="theme" title="Toggle theme">◐</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   FMOps console. Vanilla JS, no build step, no external dependencies.
   Every number rendered here comes from the FMOps API. When a value is
   absent the UI says so -- it never substitutes a placeholder number.
   ===================================================================== */

/* ------------------------------------------------------------- utils --- */
const $ = (s, r) => (r || document).querySelector(s);
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const NA = '<span class="dim">&mdash;</span>';
function has(v){ return v !== null && v !== undefined && v !== ""; }
function num(v, d){ if(!has(v) || typeof v !== "number" || !isFinite(v)) return NA;
  return `<span class="mono">${v.toFixed(d === undefined ? 4 : d)}</span>`; }
function int(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${v.toLocaleString()}</span>`; }
function pct(v, d){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${(v * 100).toFixed(d === undefined ? 1 : d)}%</span>`; }
function ms(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${v.toFixed(1)} ms</span>`; }
function usd(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">$${v.toFixed(v < 1 ? 6 : 2)}</span>`; }
function when(v){ if(!has(v)) return NA;
  const d = new Date(v); if(isNaN(d)) return `<span class="mono">${esc(v)}</span>`;
  return `<span class="mono" title="${esc(v)}">${d.toISOString().slice(0,19).replace("T"," ")}</span>`; }
function ago(v){ if(!has(v)) return ""; const d = new Date(v); if(isNaN(d)) return "";
  const s = (Date.now() - d.getTime())/1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60)+"m ago";
  if(s < 86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }

function badge(text, kind, dot){
  return `<span class="badge ${kind||"mute"}">${dot?'<i class="dot"></i>':""}${esc(text)}</span>`; }
function boolBadge(v, tTrue, tFalse, invert){
  if(!has(v)) return badge("unknown","mute");
  const good = invert ? !v : !!v;
  return badge(v ? (tTrue||"yes") : (tFalse||"no"), good ? "ok" : "bad", true); }

function card(title, bodyHtml, opts){
  const o = opts || {};
  return `<section class="card">
    <header><h3>${esc(title)}</h3>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:""}
      <span class="spacer"></span>${o.right||""}</header>
    <div class="body ${o.flush?"flush":""}">${bodyHtml}</div></section>`; }

function kpi(label, value, meta){
  return `<div class="kpi"><div class="k">${esc(label)}</div>
    <div class="v">${value}</div><div class="m">${meta||"&nbsp;"}</div></div>`; }

function table(cols, rows, opts){
  const o = opts || {};
  if(!rows || !rows.length) return emptyState(o.empty || "No records.");
  const head = cols.map(c => `<th${c.num?' class="num"':""}>${esc(c.label)}</th>`).join("");
  const body = rows.map(r => "<tr>" + cols.map(c =>
    `<td${c.num?' class="num"':""}>${c.render(r)}</td>`).join("") + "</tr>").join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`; }

function emptyState(msg){ return `<div class="state"><div class="big">Nothing to show</div>${esc(msg)}</div>`; }
function unavailable(reason){
  return `<div class="state"><div class="big">Data unavailable</div>${esc(reason || "The backend did not return this section.")}</div>`; }
function errorState(msg, retryId){
  return `<div class="state"><div class="big">Unable to load data</div>
    <div style="margin-bottom:10px">${esc(msg)}</div>
    <button class="btn" data-retry="${esc(retryId||"")}">Retry</button></div>`; }
function skeleton(n){ let s = ""; for(let i=0;i<(n||5);i++)
  s += `<div class="sk" style="margin:9px 14px;width:${55+((i*17)%40)}%"></div>`; return `<div style="padding:8px 0">${s}</div>`; }

/* horizontal bar list -- used for feature drift and token/model splits */
function barList(items, opts){
  const o = opts || {};
  if(!items.length) return emptyState(o.empty || "No values.");
  const max = o.max || Math.max(...items.map(i => Math.abs(i.value) || 0), o.threshold || 0) || 1;
  return `<div style="display:grid;gap:8px">` + items.map(i => {
    const w = Math.max(1, Math.min(100, (Math.abs(i.value)/max)*100));
    const cls = i.bad ? "bad" : (i.good ? "ok" : "");
    return `<div style="display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr minmax(64px,auto) auto;
      gap:10px;align-items:center">
      <span class="mono" style="font-size:11.5px">${esc(i.label)}</span>
      <div class="bar"><i class="${cls}" style="width:${w}%"></i></div>
      <span class="num">${typeof i.value === "number" ? i.value.toFixed(4) : esc(i.value)}</span>
      <span>${i.tag||""}</span></div>`; }).join("") + `</div>`; }

/* minimal SVG line chart -- points only, no library */
function lineChart(series, opts){
  const o = opts || {}, W = o.width || 640, H = o.height || 130, P = 26;
  const pts = series.filter(p => typeof p.y === "number" && isFinite(p.y));
  if(pts.length < 2) return `<div class="state">${esc(o.empty || "Not enough data points to plot.")}</div>`;
  const ys = pts.map(p => p.y), min = Math.min(...ys, 0), max = Math.max(...ys);
  const span = (max - min) || 1;
  const x = i => P + (i/(pts.length-1)) * (W - P - 8);
  const y = v => H - P - ((v - min)/span) * (H - P - 12);
  const d = pts.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const area = d + ` L${x(pts.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    <line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="var(--line)"/>
    <text x="2" y="14" font-size="9" fill="var(--ink-3)">${max.toFixed(o.dp===undefined?2:o.dp)}</text>
    <text x="2" y="${H-P}" font-size="9" fill="var(--ink-3)">${min.toFixed(o.dp===undefined?2:o.dp)}</text>
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="2.2"
       fill="var(--accent)"><title>${esc(p.x)}: ${p.y}</title></circle>`).join("")}
  </svg>`; }

/* -------------------------------------------------------------- api ----- */
const api = (() => {
  const cache = new Map();
  async function raw(path, init){
    const res = await fetch(path, Object.assign({ headers: { "Accept": "application/json" } }, init||{}));
    const text = await res.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch(e){ body = text; }
    if(!res.ok){
      const msg = (body && body.error && body.error.message) || (typeof body === "string" ? body : "") ||
        `HTTP ${res.status}`;
      const err = new Error(msg); err.status = res.status; err.body = body; throw err;
    }
    return body;
  }
  return {
    /* GET with a short TTL so switching pages does not re-hit the same
       endpoint repeatedly. Stable data gets a longer TTL than live data. */
    async get(path, ttlMs){
      const ttl = ttlMs === undefined ? 8000 : ttlMs;
      const hit = cache.get(path);
      if(hit && ttl > 0 && (Date.now() - hit.t) < ttl) return hit.v;
      const v = await raw(path);
      cache.set(path, { t: Date.now(), v });
      return v;
    },
    post(path, body, apiKey){
      const headers = { "Content-Type": "application/json", "Accept": "application/json" };
      if(apiKey) headers["X-API-Key"] = apiKey;
      return raw(path, { method: "POST", headers, body: body ? JSON.stringify(body) : "{}" });
    },
    text(path){ return fetch(path).then(r => r.text()); },
    bust(){ cache.clear(); }
  };
})();

/* Load several endpoints at once; a failure on one does not sink the page. */
async function loadAll(spec, ttl){
  const keys = Object.keys(spec);
  const out = {};
  await Promise.all(keys.map(async k => {
    try { out[k] = { ok: true, data: await api.get(spec[k], ttl) }; }
    catch(e){ out[k] = { ok: false, error: e.message || String(e) }; }
  }));
  return out;
}
function sect(res, render, label){
  if(!res) return unavailable();
  if(!res.ok) return errorState(`${label||"Endpoint"}: ${res.error}`, location.hash);
  return render(res.data);
}

/* ------------------------------------------------------------ toasts ---- */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s";
    setTimeout(() => el.remove(), 260); }, 4200);
}

/* --------------------------------------------------- guarded actions ---- */
/* Write endpoints require an API key. The key is asked for per action, held
   in a local variable for the duration of that one request, and never
   written to localStorage, sessionStorage, a cookie or the URL. */
let AUTH_REQUIRED = null;   // null = not yet known
async function authRequired(){
  if(AUTH_REQUIRED !== null) return AUTH_REQUIRED;
  try {
    const cfg = await api.get("/api/v1/config", 60000);
    AUTH_REQUIRED = ((cfg.security || {}).auth_backend || "none") !== "none";
  } catch(e){
    // If the backend cannot be asked, ask for a key rather than send a write
    // that is about to be rejected.
    AUTH_REQUIRED = true;
  }
  return AUTH_REQUIRED;
}

function confirmAction(opts){
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="box">
      <div class="body" style="padding:16px">
        <h3>${esc(opts.title)}</h3>
        <p style="color:var(--ink-2);margin:8px 0 12px;font-size:12.5px">${esc(opts.body)}</p>
        ${opts.needsKey ? `<label style="font-size:11.5px;color:var(--ink-3)">API key (X-API-Key)</label>
          <input type="password" id="ackey" autocomplete="off" placeholder="required for write actions">
          <p style="font-size:11px;color:var(--ink-3);margin:6px 0 0">
            Used for this request only. Not stored anywhere in the browser.</p>` : ""}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
          <button class="btn" id="acno">Cancel</button>
          <button class="btn ${opts.danger?"danger":"pri"}" id="acyes">${esc(opts.confirm||"Confirm")}</button>
        </div>
      </div></div>`;
    document.body.appendChild(m);
    const done = v => { m.remove(); resolve(v); };
    $("#acno", m).onclick = () => done(null);
    $("#acyes", m).onclick = () => done({ key: opts.needsKey ? ($("#ackey", m).value || "") : "" });
    m.onclick = e => { if(e.target === m) done(null); };
  });
}
async function runAction(opts){
  if(opts.needsKey) opts = { ...opts, needsKey: await authRequired() };
  const c = await confirmAction(opts);
  if(!c) return;
  if(opts.needsKey && !c.key){ toast("An API key is required for this action.", "bad"); return; }
  try {
    await api.post(opts.path, opts.payload, c.key);
    api.bust();
    toast(opts.success || "Action completed.", "ok");
    render();
  } catch(e){
    toast((e.status === 401 || e.status === 403)
      ? "Rejected: the API key was missing or not accepted."
      : `Failed: ${e.message}`, "bad");
  }
}

          ${badge(target.confidence + " confidence", target.confidence==="high"?"ok":target.confidence==="medium"?"warn":"bad")}
        </div>
        <ul style="margin:0 0 10px;padding-left:18px;color:var(--ink-2)">
          ${(target.reasons||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}
        </ul>
        ${Object.keys(target.class_balance||{}).length ? `<div class="dim" style="font-size:11.5px">
          Class balance: ${Object.entries(target.class_balance).map(([k,v])=>
            `<span class="mono">${esc(k)}</span> ${(v*100).toFixed(1)}%`).join(" · ")}</div>`:""}
      </div>
      <div style="min-width:220px">
        <label class="lbl" for="amtarget">Use a different column</label>
        <select id="amtarget">${(prof.columns||[]).map(c =>
          `<option value="${esc(c.name)}" ${c.name===AUTOML.target?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
        ${others.length?`<div class="dim" style="font-size:11.5px;margin-top:7px">Also plausible:
          ${others.map(o=>`<span class="mono">${esc(o.column)}</span>`).join(", ")}</div>`:""}
      </div>
    </div>` : `<div class="state"><div class="big">No target could be recommended</div>
      Nothing in this dataset looks like a label. Choose the column to predict:
      <div style="max-width:260px;margin:12px auto 0">
        <select id="amtarget">${(prof.columns||[]).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select>
      </div></div>`, { sub:"step 2 of 4" });

  // Step 3 -- problem type
  const supported = d.problem_supported;
  const problemCard = card("3. Problem type", `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <b>${esc((d.problem_type||"unknown").replace(/_/g," "))}</b>
      ${supported ? badge("supported","ok",true) : badge("not supported by this platform","bad",true)}
    </div>
    ${supported ? `<p class="dim" style="margin:0">${esc(d.metric_note||"")}</p>
      <div class="grid g2" style="margin-top:12px">
        <div><label class="lbl" for="ammetric">Primary metric</label>
          <select id="ammetric">${[d.primary_metric, ...(d.secondary_metrics||[])].map(m =>
            `<option value="${esc(m)}" ${m===AUTOML.metric?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
        <div><label class="lbl" for="amstage">If the gate passes</label>
          <select id="amstage">
            <option value="Staging">Promote to Staging</option>
            <option value="Production">Promote to Production</option>
          </select></div>
      </div>`
    : `<div class="note" style="border-color:var(--bad-line);background:var(--bad-bg)">
        <b>This platform trains binary classification only.</b> The training stack casts the label to
        an integer and evaluates with ROC-AUC over two classes, so a
        ${esc((d.problem_type||"").replace(/_/g," "))} target cannot be fitted here. Pick a different
        target column, or use a dataset whose label has two classes.</div>`}`,
    { sub:"step 3 of 4" });

  // Step 4 -- candidates
  const cands = d.candidates || [];
  const usable = cands.filter(c => c.available);
  const candCard = card("4. Candidate models", supported ? `
    <div class="grid g3">${usable.map(c => `
      <label class="cand ${AUTOML.selection.includes(c.algorithm)?"on":""}">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <input type="checkbox" class="amcand" value="${esc(c.algorithm)}"
                 ${AUTOML.selection.includes(c.algorithm)?"checked":""}>
          <b>${esc(c.label)}</b>
          ${badge(c.tier, c.tier==="recommended"?"ok":c.tier==="baseline"?"info":"mute")}
        </div>
        <ul style="margin:0;padding-left:17px;color:var(--ink-3);font-size:11.5px">
          ${(c.reasons||[]).slice(0,3).map(x=>`<li>${esc(x)}</li>`).join("")}
        </ul>
      </label>`).join("")}</div>
    ${cands.filter(c=>!c.available).length ? `<p class="dim" style="margin:12px 0 0;font-size:11.5px">
      Unavailable here: ${cands.filter(c=>!c.available).map(c=>
        `<span class="mono">${esc(c.label)}</span>`).join(", ")}
      — ${esc(cands.filter(c=>!c.available)[0].unavailable_reason||"")}</p>`:""}
    <div style="display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap">
      <label style="display:flex;gap:7px;align-items:center;cursor:pointer">
        <input type="checkbox" id="amtune"> Run hyperparameter search per candidate</label>
      <span class="dim" id="amcount"></span>
      <span class="spacer"></span>
      <button class="btn pri" id="amstart">Start AutoML</button>
    </div>
    <div class="note" style="margin-top:12px">The winner is registered and then judged by the
      <b>same approval gate</b> as any other model. AutoML picks a candidate; it does not decide
      what reaches production.</div>
    <div id="amresult" style="margin-top:12px"></div>`
    : `<div class="state">Choose a binary target above to see candidate models.</div>`,
    { sub:"step 4 of 4" });

  return stats + warn + targetCard + problemCard + candCard + columns;
}

/* ---- Run detail / leaderboard ------------------------------------------ */
function renderAutoMLRun(run){
  const lb = run.leaderboard || [];
  const cands = run.candidates || [];
  const failed = cands.filter(c => c.status === "failed");
  const prom = run.promotion || {};
  const best = lb[0];

  const head = `<div class="grid g4" style="margin-bottom:14px">
    ${kpi("Status", automlStatusBadge(run.status),
          has(run.duration_seconds)?`${Number(run.duration_seconds).toFixed(1)}s`:"")}
    ${kpi("Candidates", int(cands.length), `${lb.length} succeeded · ${failed.length} failed`)}
    ${kpi("Primary metric", `<span class="mono">${esc(run.primary_metric)}</span>`)}
    ${kpi("Best candidate", best?`<span class="mono">${esc(best.algorithm)}</span>`:NA,
          best&&has(best.model_version)?`registered v${esc(best.model_version)}`:"")}
  </div>`;

  const bestCard = best ? card("Best candidate for this run", `
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <b class="mono" style="font-size:16px">${esc(best.algorithm)}</b>
      ${badge("rank 1","ok")}
      ${has(best.model_version)?badge("registered v"+best.model_version,"info"):""}
    </div>
    <div class="grid g4">
      ${kpi(run.primary_metric, num((best.metrics||{})[run.primary_metric]))}
      ${kpi("F1", num((best.metrics||{}).f1))}
      ${kpi("Precision", num((best.metrics||{}).precision))}
      ${kpi("Recall", num((best.metrics||{}).recall))}
    </div>
    <p class="dim" style="margin:12px 0 0">Selected because it achieved the highest
      <span class="mono">${esc(run.primary_metric)}</span> among the candidates that trained
      successfully in this run. ${esc(run.ranking_rule||"")}</p>`) : "";

  const board = card("Leaderboard", table([
    { label:"Rank", render:c => `<b>#${c.rank}</b>` },
    { label:"Model", render:c => `<span class="mono">${esc(c.algorithm)}</span>` },
    { label:run.primary_metric, num:true, render:c => num((c.metrics||{})[run.primary_metric]) },
    { label:"F1", num:true, render:c => num((c.metrics||{}).f1) },
    { label:"Precision", num:true, render:c => num((c.metrics||{}).precision) },
    { label:"Recall", num:true, render:c => num((c.metrics||{}).recall) },
    { label:"Accuracy", num:true, render:c => num((c.metrics||{}).accuracy) },
    { label:"Time", num:true, render:c => has(c.duration_seconds)?`<span class="mono">${c.duration_seconds}s</span>`:NA },
    { label:"Version", render:c => has(c.model_version)?`<span class="mono">v${esc(c.model_version)}</span>`:NA },
  ], lb, { empty:"No candidate completed successfully." }), { flush:true,
     sub: lb.length ? `ranked by ${run.primary_metric}` : "" });

  const failures = failed.length ? card("Failed candidates", table([
    { label:"Model", render:c => `<span class="mono">${esc(c.algorithm)}</span>` },
    { label:"Error", render:c => `<span class="dim">${esc(String(c.error||"").slice(0,180))}</span>` },
  ], failed, { empty:"" }), { flush:true,
    sub:"a failed candidate never enters the ranking" }) : "";

  const gate = Object.keys(prom).length ? card("Approval gate", `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      ${badge(prom.decision, prom.decision==="approved"?"ok":"bad", true)}
      ${prom.promoted ? badge("promoted to "+esc(prom.final_stage||""),"ok")
                      : badge("not promoted","mute")}
    </div>
    <p style="margin:0;color:var(--ink-2)">${esc(prom.reason||"")}</p>
    ${(prom.failed_checks||[]).length?`<p style="margin:10px 0 0">Failed checks:
      ${prom.failed_checks.map(c=>badge(c,"bad")).join(" ")}</p>`:""}
    ${!prom.promoted?`<div class="note" style="margin-top:12px">The candidate is registered but
      <b>not eligible for production</b>. The production model is unchanged. This is the gate
      working: a candidate that does not clear the bar does not ship.</div>`:""}`)
    : "";

  const repro = card("Reproducibility", `<dl class="kv">
    <dt>Run</dt><dd class="mono">${esc(run.run_id)}</dd>
    <dt>Dataset version</dt><dd class="mono">${esc(run.dataset_version)}</dd>
    <dt>Target</dt><dd class="mono">${esc(run.target_column)}</dd>
    <dt>Problem type</dt><dd>${esc((run.problem_type||"").replace(/_/g," "))}</dd>
    <dt>Candidates</dt><dd class="mono">${(run.algorithms||[]).join(", ")}</dd>
    <dt>Primary metric</dt><dd class="mono">${esc(run.primary_metric)}</dd>
    <dt>Hyperparameter search</dt><dd>${run.tune?badge("enabled","info"):`<span class="dim">disabled</span>`}</dd>
    <dt>Target stage</dt><dd class="mono">${esc(run.target_stage||"")}</dd>
    <dt>Started</dt><dd>${when(run.started_at||run.created_at)}</dd>
    <dt>Completed</dt><dd>${when(run.completed_at)}</dd>
  </dl>`);

  const err = run.error ? `<div class="note" style="border-color:var(--bad-line);
    background:var(--bad-bg);margin-bottom:14px"><b>Run failed.</b><br>${esc(run.error)}</div>` : "";

  return err + head + bestCard + board + failures + gate + repro;
}

function runStatusBadge(s){
  const map = { completed:"ok", rejected:"warn", failed:"bad", running:"info", queued:"mute" };
  return badge(s || "unknown", map[s] || "mute", s === "running" || s === "queued");
}

function renderRunDetail(run){
  const rep = run.report || {}, m = run.metrics || {};
  const stages = ["Dataset","Validation","Features","Training"];
  if(run.tune) stages.push("Tuning");
  stages.push("Evaluation");
  if(run.promote) stages.push("Approval gate");
  if(rep.promoted) stages.push("Promoted");
  const done = run.status === "completed";
  const pipeline = `<div class="flow">${stages.map((s,i,a) =>
    `<span class="step ${done?"done":""}">${esc(s)}</span>` +
    (i<a.length-1?'<span class="arw">-&gt;</span>':"")).join("")}</div>`;

  const metrics = Object.keys(m).length ? `<div class="grid g4" style="margin-top:14px">
      ${kpi("Accuracy", num(m.accuracy))}${kpi("Precision", num(m.precision))}
      ${kpi("Recall", num(m.recall))}${kpi("F1", num(m.f1))}</div>
    <div class="grid g4" style="margin-top:12px">
      ${kpi("ROC-AUC", num(m.roc_auc))}${kpi("PR-AUC", num(m.pr_auc))}
      ${kpi("Log loss", num(m.log_loss))}${kpi("Brier", num(m.brier_score))}</div>`
    : `<div class="state" style="margin-top:12px">No metrics - the run did not reach evaluation.</div>`;

  const tuning = rep.tuning ? card("Hyperparameter search", `<dl class="kv">
      <dt>Backend</dt><dd class="mono">${esc(rep.tuning.backend)}</dd>
      <dt>Trials</dt><dd class="mono">${esc(rep.tuning.trials)}</dd>
      <dt>Best score</dt><dd>${num(rep.tuning.best_score)}</dd>
      <dt>Best params</dt><dd class="mono" style="font-size:11px">${esc(JSON.stringify(rep.tuning.best_params||{}))}</dd>
    </dl>`) : "";

  const cmp = rep.comparison;
  const approval = has(rep.approval_decision) ? card("Approval gate", `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
        ${badge(rep.approval_decision, rep.approval_decision==="approved"?"ok":"bad", true)}
        ${rep.promoted ? badge("promoted to " + (rep.final_stage||""),"ok")
                       : badge("not promoted","mute")}</div>
      <p style="margin:0;color:var(--ink-2)">${esc(rep.approval_reason||"")}</p>
      ${(rep.failed_checks||[]).length ? `<p style="margin:10px 0 0">Failed checks:
        ${(rep.failed_checks||[]).map(c=>badge(c,"bad")).join(" ")}</p>`:""}
      ${cmp ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)">
        <div class="dim" style="font-size:10.5px;font-weight:700;letter-spacing:.06em;
          text-transform:uppercase;margin-bottom:6px">Champion / challenger</div>
        <span class="mono">${esc(cmp.metric||"")}</span>:
        candidate ${num(cmp.candidate_value)} vs baseline ${num(cmp.baseline_value)}
        &rarr; ${badge(cmp.decision||"-", cmp.decision==="promote"?"ok":"bad")}
      </div>`:""}`) : "";

  const error = run.error ? `<div class="note" style="border-color:var(--bad);
    background:var(--bad-bg);margin-bottom:14px"><b>Run failed.</b><br>${esc(run.error)}</div>` : "";

  return card("Run " + esc(String(run.run_id).replace("train-","")), `
    ${error}
    <dl class="kv">
      <dt>Status</dt><dd>${runStatusBadge(run.status)}</dd>
      <dt>Dataset</dt><dd class="mono">${esc(run.dataset_version || "latest registered")}</dd>
      <dt>Algorithm</dt><dd class="mono">${esc(run.algorithm||"-")}</dd>
      <dt>Tuning</dt><dd>${run.tune?badge("enabled","info"):`<span class="dim">disabled</span>`}</dd>
      <dt>Model</dt><dd>${has(run.model_version)?`<b class="mono">v${esc(run.model_version)}</b>
        <span class="dim">${esc(run.model_name||"")}</span>`:NA}</dd>
      <dt>Duration</dt><dd>${has(run.duration_seconds)?`<span class="mono">${run.duration_seconds.toFixed(2)}s</span>`:NA}</dd>
      <dt>Started</dt><dd>${when(run.started_at || run.created_at)}</dd>
      <dt>Completed</dt><dd>${when(run.completed_at)}</dd>
    </dl>
    ${pipeline}
    ${metrics}`) + tuning + approval;
}

PAGES.models = {

  intro: "Model registry. Versions, stages, offline evaluation metrics and the approval gate each version was measured against.",

      <div class="grid g4">
        ${kpi("Min F1", num(th.min_f1,2), gateMet(met.f1, th.min_f1))}
        ${kpi("Min ROC-AUC", num(th.min_roc_auc,2), gateMet(met.roc_auc, th.min_roc_auc))}
        ${kpi("Min precision", num(th.min_precision,2), gateMet(met.precision, th.min_precision))}
        ${kpi("Max latency p95", ms(th.max_inference_latency_ms),
              gateMet(th.max_inference_latency_ms, met.inference_latency_p95_ms))}
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        ${boolBadge(th.require_clean_validation,"clean validation required","validation optional")}
        ${boolBadge(th.require_manual_approval,"manual approval required","auto-promote allowed", true)}
      </div>`) : "";

    const detail = m.available ? card("Offline evaluation — serving version", `
      <div class="grid g4">
        ${kpi("Accuracy", num(met.accuracy))}${kpi("Precision", num(met.precision))}
        ${kpi("Recall", num(met.recall))}${kpi("F1", num(met.f1))}
      </div>
      <div class="grid g4" style="margin-top:12px">
        ${kpi("ROC-AUC", num(met.roc_auc))}${kpi("PR-AUC", num(met.pr_auc))}
        ${kpi("Log loss", num(met.log_loss))}${kpi("Brier", num(met.brier_score))}
      </div>
      <div class="grid g3" style="margin-top:12px">
        ${kpi("Latency p50", ms(met.inference_latency_p50_ms))}
        ${kpi("Latency p95", ms(met.inference_latency_p95_ms))}
        ${kpi("Eval samples", int(met.n_samples), `positive rate ${(met.positive_rate*100||0).toFixed(1)}%`)}
      </div>
      <div class="note" style="margin-top:14px">These are <b>offline</b> metrics from the held-out
        evaluation set. Live quality requires ground-truth labels — see Monitoring.</div>`) : "";

    const lifecycle = card("Model lifecycle", `<div class="flow">
      <span class="step done">Registered</span><span class="arw">→</span>
      <span class="step done">Evaluated</span><span class="arw">→</span>
      <span class="step ${m.current_stage?"done":""}">Approved</span><span class="arw">→</span>
      <span class="step ${m.current_stage==="Production"?"on":""}">Production</span>
    </div>`);

    const tbl = card("Registered versions", table([
      { label:"Version", render:v => `<b class="mono">v${esc(v.version)}</b>` },
      { label:"Stage", render:v => badge(v.stage || "None", v.stage==="Production"?"ok":v.stage==="Staging"?"info":"mute") },
      { label:"Status", render:v => badge(v.status || "—","mute") },
      { label:"ROC-AUC", num:true, render:v => num(v.roc_auc) },
      { label:"F1", num:true, render:v => num(v.f1) },
      { label:"Created", render:v => when(v.created_at) },
      { label:"Actions", render:v => v.stage === "Production" ? `<span class="dim">serving</span>` :
          `<button class="btn" data-act="promote" data-model="${esc(m.model_name)}" data-ver="${esc(v.version)}">Promote</button>` },
    ], versions, { empty:"No versions registered." }), { flush:true,
      sub: `${versions.length} version${versions.length===1?"":"s"}` });

    return sect(r.models, () => "", "models") + tbl + detail + gate + lifecycle;
  }
};
function gateMet(actual, threshold){
  if(!has(actual) || !has(threshold)) return "";
  return actual >= threshold ? badge("met","ok") : badge("not met","bad");
}

PAGES.champion = {
  title: "Champion / Challenger",
  intro: "Every candidate is compared against the incumbent. It is promoted only if it clears the absolute gate and beats the champion by the configured margin.",
  async render(){
    const d = await api.get("/api/v1/dashboard", 8000);
    const m = d.model || {}, th = m.thresholds || {};
    const vs = (m.versions || []).slice().sort((a,b) => Number(b.version) - Number(a.version));
    const champ = vs.find(v => v.stage === "Production") || vs[vs.length-1];
    const chall = vs.find(v => v !== champ && v.stage !== "Production");

    const metric = th.comparison_metric || "roc_auc";
    const minImp = has(th.min_improvement) ? th.min_improvement : null;

    if(!champ) return unavailable("No registered versions to compare.");

    if(!chall) return card("Comparison", `<div class="state">
      <div class="big">No challenger registered</div>
      Only one version exists (<span class="mono">v${esc(champ.version)}</span>, ${esc(champ.stage||"—")}).
      A challenger appears here after the training or retraining pipeline registers a new candidate.</div>`)
      + gateExplainer(th, metric, minImp)
      + card("Champion", versionPanel(champ, "CHAMPION"));

    const delta = (a,b) => (has(a) && has(b)) ? a - b : null;
    const rows = [["ROC-AUC","roc_auc"],["F1","f1"]].map(([label,key]) => {
      const c = champ[key], k = chall[key], dl = delta(k,c);
      return { label, c, k, dl, decisive: key === metric };
    });

    const dMetric = delta(chall[metric], champ[metric]);
    let verdict;
    if(dMetric === null) verdict = badge("Not comparable — metric missing on one side","mute");
    else if(minImp !== null && dMetric >= minImp)
      verdict = badge(`PASS — challenger exceeds champion by ${dMetric.toFixed(4)} (≥ ${minImp})`,"ok",true);
    else verdict = badge(`REJECTED — improvement ${dMetric.toFixed(4)} is below the required ${minImp}`,"bad",true);

    const compare = card("Head to head", `
      <div class="grid g2" style="margin-bottom:14px">
        ${versionPanel(champ,"CHAMPION")}${versionPanel(chall,"CHALLENGER")}</div>
      <div class="scroll"><table><thead><tr>
        <th>Metric</th><th class="num">Champion v${esc(champ.version)}</th>
        <th class="num">Challenger v${esc(chall.version)}</th><th class="num">Difference</th><th></th>
      </tr></thead><tbody>${rows.map(r => `<tr>
        <td>${esc(r.label)}${r.decisive?" "+badge("decisive","info"):""}</td>
        <td class="num">${num(r.c)}</td><td class="num">${num(r.k)}</td>
        <td class="num">${r.dl===null?NA:`<span class="mono" style="color:${r.dl>=0?"var(--ok)":"var(--bad)"}">
          ${r.dl>=0?"+":""}${r.dl.toFixed(4)}</span>`}</td>
        <td>${r.dl===null?"":(r.dl>=0?badge("better","ok"):badge("worse","bad"))}</td></tr>`).join("")}
      </tbody></table></div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">
        <div class="dim" style="font-size:11px;font-weight:700;letter-spacing:.06em;
          text-transform:uppercase;margin-bottom:7px">Gate decision</div>${verdict}</div>`);

    return compare + gateExplainer(th, metric, minImp);
  }
};
function versionPanel(v, role){
  return `<div class="kpi"><div class="k">${role}</div>
    <div class="v">v${esc(v.version)}</div>
    <div class="m">${badge(v.stage||"None", v.stage==="Production"?"ok":"mute")}

      ["llm-safety","Safety","⛨"] ] },
  { group:"System", items:[ ["system","System Health","♥"], ["__docs","API Docs","↗"] ] },

function buildNav(){
  const cur = route();
  $("#nav").innerHTML = NAV.map(sec =>
    (sec.group ? `<div class="navgrp">${esc(sec.group)}</div>` : "") +
    sec.items.map(([id,label,icon]) => id === "__docs"
      ? `<a class="navlink" href="/docs" target="_blank" rel="noopener">
           <span class="ico">${icon}</span>${esc(label)}</a>`
      : `<a class="navlink ${id===cur?"on":""}" href="#/${id}">
           <span class="ico">${icon}</span>${esc(label)}</a>`).join("")
  ).join("");
}
function route(){
  const r = (location.hash || "#/overview").replace(/^#\//,"").split("?")[0];
  return PAGES[r] ? r : "overview";
}

let refreshTimer = null;
async function render(){
  const id = route(), page = PAGES[id];
  buildNav();
  $("#crumb").textContent = page.title;
  document.title = `${page.title} · FMOps Platform`;
  const view = $("#view");
  view.innerHTML = `<div class="phead"><h1>${esc(page.title)}</h1>
    <p>${esc(page.intro||"")}</p></div>` + skeleton(6);

  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }

  let html;
  try { html = await page.render(); }
  catch(e){ html = errorState(e.message || String(e), id); }
  if(route() !== id) return;                       // navigated away mid-load
  view.innerHTML = `<div class="phead"><h1>${esc(page.title)}</h1>
    <p>${esc(page.intro||"")}</p></div>` + html;

  /* Auto-refresh only where it is genuinely useful, only while the tab is
     visible, and never faster than the backend sampling interval. */
  if(page.refresh){
    refreshTimer = setInterval(() => {
      if(document.visibilityState === "visible" && route() === id){ api.bust(); render(); }
    }, page.refresh);
  }
  wirePage();
}


/* A run in flight is the one thing worth following without a manual refresh.
   Polls until the run reaches a terminal state, then stops -- there is nothing
   further to learn, so continuing would be pure load. */
async function pollRun(runId, attempt){
  attempt = attempt || 0;
  if(attempt > 200) return;
  let run;
  try { run = await api.get(`/api/v1/training/runs/${encodeURIComponent(runId)}`, 0); }
  catch(e){ return; }

  const box = $("#trresult");
  if(box) box.innerHTML = `<div class="note"><b>Run ${esc(runId)}</b> &mdash;
    ${runStatusBadge(run.status)}${run.duration_seconds != null
      ? ` <span class="dim">${run.duration_seconds.toFixed(1)}s</span>` : ""}</div>`;

  if(["completed","failed","rejected"].includes(run.status)){
    api.bust();
    toast(`Training ${run.status}.`, run.status === "completed" ? "ok" : "bad");
    const detail = $("#trdetail");
    if(detail) detail.innerHTML = renderRunDetail(run);
    if(route() === "training") render();
    return;
  }
  setTimeout(() => pollRun(runId, attempt + 1), 3000);
}

function wirePage(){
  document.querySelectorAll("[data-retry]").forEach(b =>
    b.onclick = () => { api.bust(); render(); });

  const q = $("#auditq"), sel = $("#auditact");
  if(q){
    const apply = () => {
      const term = (q.value||"").toLowerCase(), act = sel.value;
      const rows = (window.__audit||[]).filter(e => {
        if(act && e.action !== act) return false;
        if(!term) return true;
        return JSON.stringify(e).toLowerCase().includes(term);
      });
      $("#audittbl").innerHTML = auditTable(rows);
      $("#auditcount").textContent = `${rows.length} of ${(window.__audit||[]).length} entries`;
    };
    q.oninput = apply; sel.onchange = apply;
  }

  /* ---- Datasets: upload, validate, preview ----------------------------- */
  const up = $("#dsupload");
  if(up) up.onclick = async () => {
    const input = $("#dsfile");
    const file = input && input.files && input.files[0];
    if(!file){ toast("Choose a CSV file first.", "bad"); return; }
    if(!/\.csv$/i.test(file.name)){ toast("Only .csv files are accepted.", "bad"); return; }

    const needsKey = await authRequired();
    const proceed = await confirmAction({
      title: "Upload dataset",
      body: `Register ${file.name} (${(file.size/1024).toFixed(0)} KB) as a new dataset version and validate it.`,
      confirm: "Upload", needsKey,
    });
    if(!proceed) return;
    if(needsKey && !proceed.key){ toast("An API key is required to upload.", "bad"); return; }

    up.disabled = true; up.textContent = "Uploading...";
    const desc = ($("#dsdesc") && $("#dsdesc").value) || "";
    const qs = `?filename=${encodeURIComponent(file.name)}&description=${encodeURIComponent(desc)}`;
    try {
      const res = await fetch("/api/v1/datasets/upload" + qs, {
        method: "POST",
        headers: Object.assign({ "Content-Type": "text/csv" },
                               proceed.key ? { "X-API-Key": proceed.key } : {}),
        body: file,
      });
      const body = await res.json();
      if(!res.ok){
        const msg = (body.error && body.error.message) || `HTTP ${res.status}`;
        $("#dsresult").innerHTML = `<div class="note" style="border-color:var(--bad);
          background:var(--bad-bg)"><b>Upload rejected.</b><br>${esc(msg)}</div>`;
        toast("Upload rejected: " + msg, "bad");
        return;
      }
      api.bust();
      toast(`Registered ${body.version} (${body.rows} rows).`, "ok");
      $("#dsresult").innerHTML =
        `<div class="note"><b>Registered ${esc(body.version)}</b> &mdash; ${body.rows} rows,
          ${body.columns} columns.</div>` +
        (body.validation ? renderValidation(body.validation) : "");
    } catch(e){
      toast("Upload failed: " + e.message, "bad");
    } finally {
      up.disabled = false; up.textContent = "Upload and validate";
    }
  };

  document.querySelectorAll('[data-act="ds-validate"]').forEach(b => b.onclick = async () => {
    const target = $("#dsdetail");
    b.disabled = true; b.textContent = "Validating...";
    target.innerHTML = card("Validation", skeleton(4), { flush:true });
    try {
      const v = await api.get(`/api/v1/datasets/${encodeURIComponent(b.dataset.v)}/validation`, 0);
      target.innerHTML = card(`Validation - ${esc(b.dataset.v)}`, renderValidation(v));
      target.scrollIntoView({ behavior:"smooth", block:"nearest" });
    } catch(e){
      target.innerHTML = card("Validation", errorState(e.message, location.hash));
    } finally { b.disabled = false; b.textContent = "Validate"; }
  });

  document.querySelectorAll('[data-act="ds-preview"]').forEach(b => b.onclick = async () => {
    const target = $("#dsdetail");
    b.disabled = true; b.textContent = "Loading...";
    target.innerHTML = card("Preview", skeleton(4), { flush:true });
    try {
      const p = await api.get(`/api/v1/datasets/${encodeURIComponent(b.dataset.v)}/preview?rows=15`, 0);
      target.innerHTML = renderPreview(p);
      target.scrollIntoView({ behavior:"smooth", block:"nearest" });
    } catch(e){
      target.innerHTML = card("Preview", errorState(e.message, location.hash));
    } finally { b.disabled = false; b.textContent = "Preview"; }
  });

  /* ---- Training: start a run, then poll it ----------------------------- */
  const start = $("#trstart");
  if(start) start.onclick = async () => {
    const stage = $("#trstage").value;
    const payload = {
      dataset_version: $("#trds").value || null,
      algorithm: $("#tralgo").value || null,
      tune: !!$("#trtune").checked,
      promote: !!stage,
    };
    if(stage) payload.target_stage = stage;

    const needsKey = await authRequired();
    const proceed = await confirmAction({
      title: "Start training run",
      body: payload.promote
        ? `Train on ${payload.dataset_version || "the latest dataset"} and, if the approval gate passes and it beats the incumbent, promote to ${stage}.`
        : `Train on ${payload.dataset_version || "the latest dataset"}. The model will not be registered.`,
      confirm: "Start training", needsKey,
    });
    if(!proceed) return;
    if(needsKey && !proceed.key){ toast("An API key is required to start training.", "bad"); return; }

    start.disabled = true; start.textContent = "Starting...";
    try {
      const res = await api.post("/api/v1/training/runs", payload, proceed.key);
      api.bust();
      toast("Training started.", "ok");
      $("#trresult").innerHTML = `<div class="note"><b>Run ${esc(res.run_id)} accepted.</b>
        Polling for progress.</div>`;
      pollRun(res.run_id);
    } catch(e){
      const msg = (e.status === 401 || e.status === 403)
        ? "Rejected: the API key was missing or not accepted." : e.message;
      $("#trresult").innerHTML = `<div class="note" style="border-color:var(--bad);
        background:var(--bad-bg)"><b>Could not start.</b><br>${esc(msg)}</div>`;
      toast(msg, "bad");
    } finally {
      start.disabled = false; start.textContent = "Start training";
    }
  };

  document.querySelectorAll('[data-act="tr-detail"]').forEach(b => b.onclick = async () => {
    const target = $("#trdetail");
    target.innerHTML = card("Run detail", skeleton(4), { flush:true });
    try {
      const run = await api.get(`/api/v1/training/runs/${encodeURIComponent(b.dataset.id)}`, 0);
      target.innerHTML = renderRunDetail(run);
      target.scrollIntoView({ behavior:"smooth", block:"nearest" });
    } catch(e){
      target.innerHTML = card("Run detail", errorState(e.message, location.hash));
    }
  });

  /* ---- AutoML wizard --------------------------------------------------- */
  const amProfile = $("#amprofile");
  if(amProfile) amProfile.onclick = async () => {
    const version = $("#amds").value;
    AUTOML.version = version;
    AUTOML.target = null; AUTOML.selection = [];
    amProfile.disabled = true; amProfile.textContent = "Profiling...";
    $("#amwizard").innerHTML = card("Profiling dataset", skeleton(5), { flush:true });
    try {
      const d = await api.get(`/api/v1/automl/profile/${encodeURIComponent(version)}`, 0);
      $("#amwizard").innerHTML = renderWizard(d);
      wireWizard();
    } catch(e){
      $("#amwizard").innerHTML = card("Profiling failed", errorState(e.message, location.hash));
    } finally {
      amProfile.disabled = false; amProfile.textContent = "Profile dataset";
    }
  };

  document.querySelectorAll('[data-act="am-detail"]').forEach(b => b.onclick = async () => {
    const target = $("#amdetail");
    target.innerHTML = card("AutoML run", skeleton(5), { flush:true });
    try {
      const run = await api.get(`/api/v1/automl/runs/${encodeURIComponent(b.dataset.id)}`, 0);
      target.innerHTML = renderAutoMLRun(run);
      target.scrollIntoView({ behavior:"smooth", block:"nearest" });
    } catch(e){
      target.innerHTML = card("AutoML run", errorState(e.message, location.hash));
    }
  });

  wireWizard();

  const rb = document.querySelector('[data-act="rollback"]');
  if(rb) rb.onclick = () => runAction({
    title:"Roll back deployment",
    body:"This restores the previous model version as the serving version. It changes what production traffic is scored by.",
    confirm:"Roll back", danger:true, needsKey:true,
    path:"/api/v1/deployments/rollback", payload:{ reason:"manual rollback from console" },
    success:"Rollback requested." });

  document.querySelectorAll('[data-act="promote"]').forEach(b => b.onclick = () => runAction({
    title:`Promote v${b.dataset.ver} to Production`,
    body:"The registry stage machine and the approval gate still apply — this request can be rejected by the backend.",
    confirm:"Promote", needsKey:true,
    path:`/api/v1/models/${encodeURIComponent(b.dataset.model)}/versions/${encodeURIComponent(b.dataset.ver)}/stage`,
    payload:{ stage:"Production" }, success:"Stage transition requested." }));

  document.querySelectorAll('[data-act="ack"]').forEach(b => b.onclick = () => runAction({
    title:"Acknowledge alert",
    body:"Marks this alert as acknowledged. It stays in the history.",
    confirm:"Acknowledge", needsKey:true,
    path:`/api/v1/alerts/${encodeURIComponent(b.dataset.id)}/acknowledge`,
    success:"Alert acknowledged." }));
}

/* ------------------------------------------------------------- header --- */

/* Re-profiling on a target change is what makes the problem type honest: a
   different column can mean a different problem, and showing the old answer
   next to the new target would be worse than showing nothing. */
function wireWizard(){
  const targetSel = $("#amtarget");
  if(targetSel) targetSel.onchange = async () => {
    AUTOML.target = targetSel.value;
    AUTOML.selection = [];
    $("#amwizard").innerHTML = card("Re-profiling for the new target", skeleton(4), { flush:true });
    try {
      const d = await api.get(
        `/api/v1/automl/profile/${encodeURIComponent(AUTOML.version)}?target=${encodeURIComponent(AUTOML.target)}`, 0);
      $("#amwizard").innerHTML = renderWizard(d);
      wireWizard();
    } catch(e){
      $("#amwizard").innerHTML = card("Profiling failed", errorState(e.message, location.hash));
    }
  };

  const metric = $("#ammetric"); if(metric) metric.onchange = () => { AUTOML.metric = metric.value; };
  const stage = $("#amstage");   if(stage)  stage.onchange  = () => { AUTOML.stage  = stage.value; };
  const tune = $("#amtune");     if(tune)   tune.onchange   = () => { AUTOML.tune   = tune.checked; };

  const boxes = [...document.querySelectorAll(".amcand")];
  const count = $("#amcount");
  const sync = () => {
    AUTOML.selection = boxes.filter(b => b.checked).map(b => b.value);
    boxes.forEach(b => b.closest(".cand").classList.toggle("on", b.checked));
    if(count) count.textContent = AUTOML.selection.length
      ? `AutoML will train ${AUTOML.selection.length} candidate model(s).`
      : "Select at least one model.";
    const start = $("#amstart");
    if(start) start.disabled = !AUTOML.selection.length;
  };
  boxes.forEach(b => b.onchange = sync);
  sync();

  const start = $("#amstart");
  if(start) start.onclick = async () => {
    const payload = {
      dataset_version: AUTOML.version,
      target_column: AUTOML.target,
      algorithms: AUTOML.selection,
      primary_metric: AUTOML.metric,
      tune: AUTOML.tune,
      target_stage: AUTOML.stage,
      max_models: Math.max(1, AUTOML.selection.length),
    };
    const needsKey = await authRequired();
    const proceed = await confirmAction({
      title: "Start AutoML",
      body: `Train ${AUTOML.selection.length} candidate model(s) on ${AUTOML.version}, target `
          + `${AUTOML.target}. The best is registered and then judged by the approval gate — `
          + `promotion is not automatic.`,
      confirm: "Start AutoML", needsKey,
    });
    if(!proceed) return;
    if(needsKey && !proceed.key){ toast("An API key is required.", "bad"); return; }

    start.disabled = true; start.textContent = "Starting...";
    try {
      const res = await api.post("/api/v1/automl/runs", payload, proceed.key);
      api.bust();
      toast("AutoML started.", "ok");
      pollAutoML(res.run_id);
    } catch(e){
      const msg = (e.status === 401 || e.status === 403)
        ? "Rejected: the API key was missing or not accepted." : e.message;
      $("#amresult").innerHTML = `<div class="note" style="border-color:var(--bad-line);
        background:var(--bad-bg)"><b>Could not start.</b><br>${esc(msg)}</div>`;
      toast(msg, "bad");
    } finally {
      start.disabled = false; start.textContent = "Start AutoML";
    }
  };
}

/* Progress from the run's own state: which stage it reached and what each
   candidate is doing. Stops the moment the run is terminal. */
async function pollAutoML(runId, attempt){
  attempt = attempt || 0;
  if(attempt > 300) return;
  let run;
  try { run = await api.get(`/api/v1/automl/runs/${encodeURIComponent(runId)}`, 0); }
  catch(e){ return; }

  const stages = ["profiling","training","ranking","completed"];
  const reached = stages.indexOf(run.status === "completed_with_warnings" ? "completed" : run.status);
  const done = ["completed","completed_with_warnings","failed"].includes(run.status);
  const cands = run.candidates || [];
  const finished = cands.filter(c => c.status !== "queued" && c.status !== "training").length;
  const pct = done ? 100 : (cands.length ? Math.round((finished / cands.length) * 100) : 5);

  const box = $("#amresult");
  if(box) box.innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
      <b class="mono">${esc(runId.replace("automl-",""))}</b> ${automlStatusBadge(run.status)}
      <span class="spacer"></span><span class="mono dim">${pct}%</span>
    </div>
    <div class="bar" style="margin-bottom:10px"><i style="width:${pct}%"></i></div>
    <div class="flow" style="margin-bottom:10px">${stages.map((s,i) =>
      `<span class="step ${done||i<reached?"done":i===reached?"on":""}">${esc(s)}</span>` +
      (i<stages.length-1?'<span class="arw">&rarr;</span>':"")).join("")}</div>
    <div style="display:grid;gap:6px">${cands.map(c =>
      `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="mono">${esc(c.algorithm)}</span>
        <span style="display:flex;gap:8px;align-items:center">
          ${c.metrics && c.metrics.roc_auc != null
            ? `<span class="mono dim">roc_auc ${Number(c.metrics.roc_auc).toFixed(4)}</span>` : ""}
          ${badge(c.status, c.status==="completed"?"ok":c.status==="failed"?"bad":
                            c.status==="training"?"info":"mute", c.status==="training")}
        </span></div>`).join("")}</div>`;

  if(done){
    api.bust();
    toast(`AutoML ${run.status.replace(/_/g," ")}.`,
          run.status === "failed" ? "bad" : "ok");
    const detail = $("#amdetail");
    if(detail) detail.innerHTML = renderAutoMLRun(run);
    return;
  }
  setTimeout(() => pollAutoML(runId, attempt + 1), 3000);
}

async function header(){
  try {
    const d = await api.get("/api/v1/dashboard", 20000);
    const svc = d.service || {}, sys = d.system || {};
    $("#envbadge").innerHTML = badge(String(svc.environment||"unknown").toUpperCase(), "info");
    const ok = sys.latency_slo_met !== false && sys.error_slo_met !== false;
    $("#healthbadge").innerHTML = badge(ok ? "Healthy" : "Degraded", ok ? "ok" : "warn", true);
  } catch(e){
    $("#envbadge").innerHTML = "";
    $("#healthbadge").innerHTML = badge("API unreachable","bad",true);
  }
}

/* --------------------------------------------------------------- boot --- */
(function boot(){
  const saved = localStorage.getItem("fmops-theme");   // a UI preference, not data
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("fmops-theme", next); } catch(e){ /* private mode */ }
  };
  $("#refresh").onclick = () => { api.bust(); render(); header(); toast("Reloaded."); };
  $("#burger").onclick = () => $("#side").classList.toggle("open");
  $("#nav").addEventListener("click", e => {
    if(e.target.closest(".navlink")) $("#side").classList.remove("open"); });
  window.addEventListener("hashchange", render);
  if(!location.hash) location.hash = "#/overview";
  render(); header();
  setInterval(header, 30000);
})();
</script>
