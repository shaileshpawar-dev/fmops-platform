<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMOps Platform — Console</title>
<style>
/* ---------------------------------------------------------------- tokens -- */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#11161d; --ink-2:#48525f;
  --ink-3:#77818f; --line:#e2e6eb; --line-2:#eef1f4; --accent:#1f6feb; --accent-ink:#fff;
  --ok:#1a7f45; --ok-bg:#e6f4ec; --warn:#8a5a00; --warn-bg:#fdf3e0;
  --bad:#b3261e; --bad-bg:#fdeceb; --info:#0b5f8a; --info-bg:#e6f2f8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sidebar:248px; --radius:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --ink:#e6edf3; --ink-2:#9fabb9;
    --ink-3:#6e7d8d; --line:#262f3b; --line-2:#1e252f; --accent:#4b8ff7;
    --ok:#4ac97e; --ok-bg:#11291d; --warn:#e3b341; --warn-bg:#2b2412;
    --bad:#f0776c; --bad-bg:#2d1a18; --info:#58b6e8; --info-bg:#11242e;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --ink:#e6edf3; --ink-2:#9fabb9;
  --ink-3:#6e7d8d; --line:#262f3b; --line-2:#1e252f; --accent:#4b8ff7;
  --ok:#4ac97e; --ok-bg:#11291d; --warn:#e3b341; --warn-bg:#2b2412;
  --bad:#f0776c; --bad-bg:#2d1a18; --info:#58b6e8; --info-bg:#11242e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
/* ---------------------------------------------------------------- layout -- */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--line)}
.brand b{font-size:14px;letter-spacing:-.02em}
.brand small{display:block;color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.logo{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:12px;flex:none}
nav{padding:10px 8px 24px}
.navgrp{margin:14px 0 5px;padding:0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--ink-3);text-transform:uppercase}
.navlink{display:flex;align-items:center;gap:9px;padding:6.5px 10px;border-radius:var(--radius);
  color:var(--ink-2);cursor:pointer;font-weight:500;border:1px solid transparent}
.navlink:hover{background:var(--panel-2);color:var(--ink)}
.navlink.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.navlink.on .ico{opacity:1}
.ico{width:15px;text-align:center;opacity:.75;font-size:12px;flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:0 22px;height:52px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.crumb{font-size:12px;color:var(--ink-3)}
.spacer{flex:1}
.content{padding:20px 22px 56px;max-width:1560px;width:100%}
.phead{margin-bottom:16px}
.phead h1{font-size:19px}
.phead p{margin:3px 0 0;color:var(--ink-3);font-size:12.5px;max-width:70ch}
/* --------------------------------------------------------------- pieces --- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);border-radius:var(--radius);cursor:pointer;
  font:inherit;font-weight:500;font-size:12px}
.btn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card>header h3{font-size:12.5px}
.card>header .sub{color:var(--ink-3);font-size:11.5px;font-weight:400}
.card .body{padding:14px}
.card .body.flush{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1300px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .k{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:21px;font-weight:650;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--panel-2);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);font-size:11.5px}
.dim{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.mute{background:var(--line-2);color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:7px 16px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.note{background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);
  border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--ink-2)}
.note b{color:var(--ink)}
.state{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:12.5px}
.state .big{font-size:13px;color:var(--ink-2);font-weight:500;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--line-2) 25%,var(--line) 37%,var(--line-2) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:4px;height:11px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.bar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar>i.bad{background:var(--bad)}.bar>i.ok{background:var(--ok)}.bar>i.warn{background:var(--warn)}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:10px 13px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.16);
  max-width:340px;animation:tin .18s ease}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.modal{position:fixed;inset:0;background:rgba(4,8,14,.55);display:grid;place-items:center;z-index:120;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:460px;width:100%}
.modal .box h3{font-size:14px}
input[type=text],input[type=password],select{width:100%;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.step{border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);
  padding:6px 11px;font-size:11.5px;font-weight:550;white-space:nowrap}
.step.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.step.done{border-color:var(--ok);color:var(--ok)}
.arw{color:var(--ink-3);font-size:11px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:550;color:var(--ink-3);
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.burger{display:none}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:var(--sidebar);z-index:60;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .content{padding:16px 14px 48px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">FM</div>
      <div><b>FMOps Platform</b><small>OPERATIONS CONSOLE</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top">
      <button class="btn burger" id="burger" aria-label="Menu">☰</button>
      <span class="crumb" id="crumb">Overview</span>
      <span class="spacer"></span>
      <span id="envbadge"></span>
      <span id="healthbadge"></span>
      <button class="btn" id="refresh" title="Reload this page's data">↻ Refresh</button>
      <button class="btn" id="theme" title="Toggle theme">◐</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";
/* =====================================================================
   FMOps console. Vanilla JS, no build step, no external dependencies.
   Every number rendered here comes from the FMOps API. When a value is
   absent the UI says so -- it never substitutes a placeholder number.
   ===================================================================== */

/* ------------------------------------------------------------- utils --- */
const $ = (s, r) => (r || document).querySelector(s);
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const NA = '<span class="dim">&mdash;</span>';
function has(v){ return v !== null && v !== undefined && v !== ""; }
function num(v, d){ if(!has(v) || typeof v !== "number" || !isFinite(v)) return NA;
  return `<span class="mono">${v.toFixed(d === undefined ? 4 : d)}</span>`; }
function int(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${v.toLocaleString()}</span>`; }
function pct(v, d){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${(v * 100).toFixed(d === undefined ? 1 : d)}%</span>`; }
function ms(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">${v.toFixed(1)} ms</span>`; }
function usd(v){ if(!has(v) || typeof v !== "number") return NA;
  return `<span class="mono">$${v.toFixed(v < 1 ? 6 : 2)}</span>`; }
function when(v){ if(!has(v)) return NA;
  const d = new Date(v); if(isNaN(d)) return `<span class="mono">${esc(v)}</span>`;
  return `<span class="mono" title="${esc(v)}">${d.toISOString().slice(0,19).replace("T"," ")}</span>`; }
function ago(v){ if(!has(v)) return ""; const d = new Date(v); if(isNaN(d)) return "";
  const s = (Date.now() - d.getTime())/1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60)+"m ago";
  if(s < 86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }

function badge(text, kind, dot){
  return `<span class="badge ${kind||"mute"}">${dot?'<i class="dot"></i>':""}${esc(text)}</span>`; }
function boolBadge(v, tTrue, tFalse, invert){
  if(!has(v)) return badge("unknown","mute");
  const good = invert ? !v : !!v;
  return badge(v ? (tTrue||"yes") : (tFalse||"no"), good ? "ok" : "bad", true); }

function card(title, bodyHtml, opts){
  const o = opts || {};
  return `<section class="card">
    <header><h3>${esc(title)}</h3>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:""}
      <span class="spacer"></span>${o.right||""}</header>
    <div class="body ${o.flush?"flush":""}">${bodyHtml}</div></section>`; }

function kpi(label, value, meta){
  return `<div class="kpi"><div class="k">${esc(label)}</div>
    <div class="v">${value}</div><div class="m">${meta||"&nbsp;"}</div></div>`; }

function table(cols, rows, opts){
  const o = opts || {};
  if(!rows || !rows.length) return emptyState(o.empty || "No records.");
  const head = cols.map(c => `<th${c.num?' class="num"':""}>${esc(c.label)}</th>`).join("");
  const body = rows.map(r => "<tr>" + cols.map(c =>
    `<td${c.num?' class="num"':""}>${c.render(r)}</td>`).join("") + "</tr>").join("");
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`; }

function emptyState(msg){ return `<div class="state"><div class="big">Nothing to show</div>${esc(msg)}</div>`; }
function unavailable(reason){
  return `<div class="state"><div class="big">Data unavailable</div>${esc(reason || "The backend did not return this section.")}</div>`; }
function errorState(msg, retryId){
  return `<div class="state"><div class="big">Unable to load data</div>
    <div style="margin-bottom:10px">${esc(msg)}</div>
    <button class="btn" data-retry="${esc(retryId||"")}">Retry</button></div>`; }
function skeleton(n){ let s = ""; for(let i=0;i<(n||5);i++)
  s += `<div class="sk" style="margin:9px 14px;width:${55+((i*17)%40)}%"></div>`; return `<div style="padding:8px 0">${s}</div>`; }

/* horizontal bar list -- used for feature drift and token/model splits */
function barList(items, opts){
  const o = opts || {};
  if(!items.length) return emptyState(o.empty || "No values.");
  const max = o.max || Math.max(...items.map(i => Math.abs(i.value) || 0), o.threshold || 0) || 1;
  return `<div style="display:grid;gap:8px">` + items.map(i => {
    const w = Math.max(1, Math.min(100, (Math.abs(i.value)/max)*100));
    const cls = i.bad ? "bad" : (i.good ? "ok" : "");
    return `<div style="display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr minmax(64px,auto) auto;
      gap:10px;align-items:center">
      <span class="mono" style="font-size:11.5px">${esc(i.label)}</span>
      <div class="bar"><i class="${cls}" style="width:${w}%"></i></div>
      <span class="num">${typeof i.value === "number" ? i.value.toFixed(4) : esc(i.value)}</span>
      <span>${i.tag||""}</span></div>`; }).join("") + `</div>`; }

/* minimal SVG line chart -- points only, no library */
function lineChart(series, opts){
  const o = opts || {}, W = o.width || 640, H = o.height || 130, P = 26;
  const pts = series.filter(p => typeof p.y === "number" && isFinite(p.y));
  if(pts.length < 2) return `<div class="state">${esc(o.empty || "Not enough data points to plot.")}</div>`;
  const ys = pts.map(p => p.y), min = Math.min(...ys, 0), max = Math.max(...ys);
  const span = (max - min) || 1;
  const x = i => P + (i/(pts.length-1)) * (W - P - 8);
  const y = v => H - P - ((v - min)/span) * (H - P - 12);
  const d = pts.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const area = d + ` L${x(pts.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    <line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="var(--line)"/>
    <text x="2" y="14" font-size="9" fill="var(--ink-3)">${max.toFixed(o.dp===undefined?2:o.dp)}</text>
    <text x="2" y="${H-P}" font-size="9" fill="var(--ink-3)">${min.toFixed(o.dp===undefined?2:o.dp)}</text>
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="2.2"
       fill="var(--accent)"><title>${esc(p.x)}: ${p.y}</title></circle>`).join("")}
  </svg>`; }

/* -------------------------------------------------------------- api ----- */
const api = (() => {
  const cache = new Map();
  async function raw(path, init){
    const res = await fetch(path, Object.assign({ headers: { "Accept": "application/json" } }, init||{}));
    const text = await res.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch(e){ body = text; }
    if(!res.ok){
      const msg = (body && body.error && body.error.message) || (typeof body === "string" ? body : "") ||
        `HTTP ${res.status}`;
      const err = new Error(msg); err.status = res.status; err.body = body; throw err;
    }
    return body;
  }
  return {
    /* GET with a short TTL so switching pages does not re-hit the same
       endpoint repeatedly. Stable data gets a longer TTL than live data. */
    async get(path, ttlMs){
      const ttl = ttlMs === undefined ? 8000 : ttlMs;
      const hit = cache.get(path);
      if(hit && ttl > 0 && (Date.now() - hit.t) < ttl) return hit.v;
      const v = await raw(path);
      cache.set(path, { t: Date.now(), v });
      return v;
    },
    post(path, body, apiKey){
      const headers = { "Content-Type": "application/json", "Accept": "application/json" };
      if(apiKey) headers["X-API-Key"] = apiKey;
      return raw(path, { method: "POST", headers, body: body ? JSON.stringify(body) : "{}" });
    },
    text(path){ return fetch(path).then(r => r.text()); },
    bust(){ cache.clear(); }
  };
})();

/* Load several endpoints at once; a failure on one does not sink the page. */
async function loadAll(spec, ttl){
  const keys = Object.keys(spec);
  const out = {};
  await Promise.all(keys.map(async k => {
    try { out[k] = { ok: true, data: await api.get(spec[k], ttl) }; }
    catch(e){ out[k] = { ok: false, error: e.message || String(e) }; }
  }));
  return out;
}
function sect(res, render, label){
  if(!res) return unavailable();
  if(!res.ok) return errorState(`${label||"Endpoint"}: ${res.error}`, location.hash);
  return render(res.data);
}

/* ------------------------------------------------------------ toasts ---- */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .25s";
    setTimeout(() => el.remove(), 260); }, 4200);
}

/* --------------------------------------------------- guarded actions ---- */
/* Write endpoints require an API key. The key is asked for per action, held
   in a local variable for the duration of that one request, and never
   written to localStorage, sessionStorage, a cookie or the URL. */
function confirmAction(opts){
  return new Promise(resolve => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `<div class="box">
      <div class="body" style="padding:16px">
        <h3>${esc(opts.title)}</h3>
        <p style="color:var(--ink-2);margin:8px 0 12px;font-size:12.5px">${esc(opts.body)}</p>
        ${opts.needsKey ? `<label style="font-size:11.5px;color:var(--ink-3)">API key (X-API-Key)</label>
          <input type="password" id="ackey" autocomplete="off" placeholder="required for write actions">
          <p style="font-size:11px;color:var(--ink-3);margin:6px 0 0">
            Used for this request only. Not stored anywhere in the browser.</p>` : ""}
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
          <button class="btn" id="acno">Cancel</button>
          <button class="btn ${opts.danger?"danger":"pri"}" id="acyes">${esc(opts.confirm||"Confirm")}</button>
        </div>
      </div></div>`;
    document.body.appendChild(m);
    const done = v => { m.remove(); resolve(v); };
    $("#acno", m).onclick = () => done(null);
    $("#acyes", m).onclick = () => done({ key: opts.needsKey ? ($("#ackey", m).value || "") : "" });
    m.onclick = e => { if(e.target === m) done(null); };
  });
}
async function runAction(opts){
  const c = await confirmAction(opts);
  if(!c) return;
  if(opts.needsKey && !c.key){ toast("An API key is required for this action.", "bad"); return; }
  try {
    await api.post(opts.path, opts.payload, c.key);
    api.bust();
    toast(opts.success || "Action completed.", "ok");
    render();
  } catch(e){
    toast((e.status === 401 || e.status === 403)
      ? "Rejected: the API key was missing or not accepted."
      : `Failed: ${e.message}`, "bad");
  }
}

      ${kpi("Concept drift", badge(dr.concept_drift_status||"unavailable",
            dr.concept_drift_status==="measured"?"info":"mute"), `engine: ${esc(dr.engine||"—")}`)}
    </div>`;

    const conceptCard = card("Concept drift", `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <b>Status</b> ${badge(dr.concept_drift_status || "unavailable",
          dr.concept_drift_status === "measured" ? "info" : "mute")}</div>
      <p style="margin:0;color:var(--ink-2)">${esc(dr.concept_drift_detail || "")}</p>
      ${dr.concept_drift_status !== "measured" ? `<div class="note" style="margin-top:12px">
        Concept drift is a change in P(y|x) — what the inputs <i>mean</i>. It cannot be derived from
        unlabelled inputs, because the inputs themselves need not change at all. This console shows
        <b>no number</b> here rather than a proxy dressed up as a measurement.</div>`:""}`);

    const featCard = card("Feature drift", barList(feats.map(f => ({
      label: f.feature, value: f.score, bad: f.drifted,
      tag: f.drifted ? badge("drifted","bad") : badge("stable","ok")
    })), { threshold: dr.threshold, empty:"No per-feature results." }),
    { sub:`PSI primary, ${esc(feats[0] ? feats[0].test : "—")} supporting · threshold ${dr.threshold}`,
      flush:false });

    const hist = (dr.history || []).slice().reverse();
    const histCard = card("Drift score history", hist.length > 1
      ? lineChart(hist.map(x => ({ x: x.created_at, y: x.score })), { dp:3 })
      : emptyState("At least two scans are needed to plot a trend."),
      { sub:`${hist.length} scan(s)` });

    const reports = sect(r.reports, d => card("Scan history", table([
      { label:"Scanned", render:x => `${when(x.created_at)} <span class="dim">${ago(x.created_at)}</span>` },
      { label:"Detected", render:x => x.drift_detected?badge("yes","bad",true):badge("no","ok",true) },
      { label:"Dataset score", num:true, render:x => num(x.dataset_drift_score) },
      { label:"Prediction score", num:true, render:x => num(x.prediction_drift_score) },
      { label:"Drifted", num:true, render:x => int((x.drifted_features||[]).length) },
      { label:"Concept", render:x => badge(x.concept_drift_status||"—",
          x.concept_drift_status==="measured"?"info":"mute") },
    ], d.reports || [], { empty:"No scans recorded." }), { flush:true }), "drift reports");

    return summary + `<div class="grid g2">${featCard}${conceptCard}</div>` + histCard + reports;
  }
};

PAGES.champion = {
  title: "Champion / Challenger",
  intro: "Every candidate is compared against the incumbent. It is promoted only if it clears the absolute gate and beats the champion by the configured margin.",
  async render(){
    const d = await api.get("/api/v1/dashboard", 8000);
    const m = d.model || {}, th = m.thresholds || {};
    const vs = (m.versions || []).slice().sort((a,b) => Number(b.version) - Number(a.version));
    const champ = vs.find(v => v.stage === "Production") || vs[vs.length-1];
    const chall = vs.find(v => v !== champ && v.stage !== "Production");

    const metric = th.comparison_metric || "roc_auc";
    const minImp = has(th.min_improvement) ? th.min_improvement : null;

    if(!champ) return unavailable("No registered versions to compare.");

    if(!chall) return card("Comparison", `<div class="state">
      <div class="big">No challenger registered</div>
      Only one version exists (<span class="mono">v${esc(champ.version)}</span>, ${esc(champ.stage||"—")}).
      A challenger appears here after the training or retraining pipeline registers a new candidate.</div>`)
      + gateExplainer(th, metric, minImp)
      + card("Champion", versionPanel(champ, "CHAMPION"));

    const delta = (a,b) => (has(a) && has(b)) ? a - b : null;
    const rows = [["ROC-AUC","roc_auc"],["F1","f1"]].map(([label,key]) => {
      const c = champ[key], k = chall[key], dl = delta(k,c);
      return { label, c, k, dl, decisive: key === metric };
    });

    const dMetric = delta(chall[metric], champ[metric]);
    let verdict;
    if(dMetric === null) verdict = badge("Not comparable — metric missing on one side","mute");
    else if(minImp !== null && dMetric >= minImp)
      verdict = badge(`PASS — challenger exceeds champion by ${dMetric.toFixed(4)} (≥ ${minImp})`,"ok",true);
    else verdict = badge(`REJECTED — improvement ${dMetric.toFixed(4)} is below the required ${minImp}`,"bad",true);

    const compare = card("Head to head", `
      <div class="grid g2" style="margin-bottom:14px">
        ${versionPanel(champ,"CHAMPION")}${versionPanel(chall,"CHALLENGER")}</div>
      <div class="scroll"><table><thead><tr>
        <th>Metric</th><th class="num">Champion v${esc(champ.version)}</th>
        <th class="num">Challenger v${esc(chall.version)}</th><th class="num">Difference</th><th></th>
      </tr></thead><tbody>${rows.map(r => `<tr>
        <td>${esc(r.label)}${r.decisive?" "+badge("decisive","info"):""}</td>
        <td class="num">${num(r.c)}</td><td class="num">${num(r.k)}</td>
        <td class="num">${r.dl===null?NA:`<span class="mono" style="color:${r.dl>=0?"var(--ok)":"var(--bad)"}">
          ${r.dl>=0?"+":""}${r.dl.toFixed(4)}</span>`}</td>
        <td>${r.dl===null?"":(r.dl>=0?badge("better","ok"):badge("worse","bad"))}</td></tr>`).join("")}
      </tbody></table></div>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">
        <div class="dim" style="font-size:11px;font-weight:700;letter-spacing:.06em;
          text-transform:uppercase;margin-bottom:7px">Gate decision</div>${verdict}</div>`);

    return compare + gateExplainer(th, metric, minImp);
  }
};
function versionPanel(v, role){
  return `<div class="kpi"><div class="k">${role}</div>
    <div class="v">v${esc(v.version)}</div>
    <div class="m">${badge(v.stage||"None", v.stage==="Production"?"ok":"mute")}
      &nbsp;<span class="dim">${esc(v.status||"")}</span></div>
    <div class="grid g2" style="margin-top:10px;gap:8px">
      <div><div class="dim" style="font-size:10.5px">ROC-AUC</div>${num(v.roc_auc)}</div>
      <div><div class="dim" style="font-size:10.5px">F1</div>${num(v.f1)}</div></div></div>`;
}
function gateExplainer(th, metric, minImp){
  return card("How the gate decides", `<p style="margin:0 0 10px;color:var(--ink-2)">
    Promotion requires <b>both</b> conditions. Clearing the absolute thresholds is not enough:
    a candidate that is merely as good as the incumbent is rejected, which is what stops run-to-run
    noise from churning the production model.</p>
    <div class="flow" style="margin-bottom:12px">
      <span class="step">Absolute thresholds</span><span class="arw">AND</span>
      <span class="step">Beats champion on <span class="mono">${esc(metric)}</span>
        by ≥ <span class="mono">${minImp === null ? "—" : minImp}</span></span>
      <span class="arw">→</span><span class="step done">Promote</span></div>
    <dl class="kv">
      <dt>Comparison metric</dt><dd class="mono">${esc(metric)}</dd>
      <dt>Minimum improvement</dt><dd class="mono">${minImp === null ? "—" : minImp}</dd>
      <dt>Manual approval</dt><dd>${boolBadge(th.require_manual_approval,"required","not required",true)}</dd>
    </dl>`);
}

            <span class="dim" style="font-size:11.5px">${esc(
              Object.entries(v||{}).filter(([kk])=>kk!=="status")
                .map(([kk,vv])=>`${kk}=${typeof vv==="object"?"…":vv}`).join(" · ").slice(0,90))}</span>
            ${badge((v&&v.status)||"?", (v&&v.status)==="ok"?"ok":"bad")}</span></div>`).join("")}</div>`),
      "health");

    const ready = sect(r.ready, d => card("Readiness", `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        ${badge(d.status||"?", d.status==="ready"?"ok":"warn", true)}</div>
      <div style="display:grid;gap:6px">${Object.entries(d.checks||{}).map(([k,v]) =>
        `<div style="display:flex;justify-content:space-between"><span class="mono">${esc(k)}</span>
         ${boolBadge(v,"ok","not ready")}</div>`).join("")}</div>
      ${d.detail?`<div class="dim" style="margin-top:10px;font-size:11.5px">${esc(
        Object.entries(d.detail).map(([k,v])=>`${k}: ${v}`).join(" · "))}</div>`:""}`), "readiness");

    /* Only a safe, explicit allowlist of configuration is rendered. */
    const cfg = sect(r.cfg, d => {
      const safe = [
        ["Environment", d.environment], ["Service", d.service_name], ["Version", d.version],
        ["Log level", d.log_level], ["Log format", d.log_format], ["Git commit", d.git_commit],
        ["Deployment provider", (d.deployment||{}).provider],
        ["Deployment strategy", (d.deployment||{}).strategy],
        ["Registry backend", (d.tracking||{}).registry_backend],
        ["Tracking backend", (d.tracking||{}).backend],
        ["Drift engine", (d.drift||{}).engine],
        ["LLM provider", (d.llm||{}).provider], ["LLM model", (d.llm||{}).model],
        ["AWS enabled", String((d.aws||{}).enabled)], ["AWS region", (d.aws||{}).region],
        ["S3 bucket", (d.aws||{}).s3_bucket],
        ["Auth backend", (d.security||{}).auth_backend],
        ["CloudWatch", String((d.monitoring||{}).cloudwatch_enabled)],
      ].filter(([,v]) => has(v));
      return card("Platform configuration", `<dl class="kv">${safe.map(([k,v]) =>
        `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("")}</dl>
        <div class="note" style="margin-top:12px">This view renders an explicit allowlist of
        non-sensitive settings. API keys, AWS credentials and connection strings are never sent to
        the browser.</div>`);
    }, "config");

    const infra = sect(r.cfg, d => {
      const aws = d.aws || {};
      const rows = [
        ["AWS integration", aws.enabled ? badge("enabled","ok",true) : badge("disabled","mute"),
          aws.enabled ? `region ${esc(aws.region||"—")}` : "adapters present, not active"],
        ["S3 artifact bucket", aws.s3_bucket ? badge("configured","info") : badge("not configured","mute"),
          aws.s3_bucket ? `<span class="mono">${esc(aws.s3_bucket)}</span>` : ""],
        ["SageMaker endpoint", badge("not deployed","mute"),
          "the deployment provider in this environment is the in-process router"],
        ["CloudWatch metrics", (d.monitoring||{}).cloudwatch_enabled ?
          badge("enabled","ok") : badge("disabled","mute"),
          "container logs ship via the ECS awslogs driver regardless"],
      ];
      return card("Infrastructure", `<div style="display:grid;gap:9px">${rows.map(([k,b,note]) =>
        `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
          <span>${esc(k)}</span><span style="display:flex;gap:9px;align-items:center;text-align:right">
          <span class="dim" style="font-size:11.5px">${note}</span>${b}</span></div>`).join("")}</div>
        <div class="note" style="margin-top:12px">Status is read from the running service's own
        configuration. It reflects what the application is set to use — it is not an independent
        probe of each AWS service.</div>`);
    }, "config");

    const res = sect(r.res, d => card("Process resources", `<div class="grid g4">
      ${kpi("CPU", has(d.cpu_percent)?`<span class="mono">${d.cpu_percent.toFixed(1)}%</span>`:NA)}
      ${kpi("Memory", has(d.memory_percent)?`<span class="mono">${d.memory_percent.toFixed(1)}%</span>`:NA)}
      ${kpi("RSS", has(d.process_rss_mb)?`<span class="mono">${d.process_rss_mb.toFixed(0)} MB</span>`:NA)}
      ${kpi("GPU", d.gpu_available?badge("present","ok"):badge("none","mute"))}
    </div>`), "resources");

    return `<div class="grid g2">${health}${ready}</div>` + infra + cfg + res;
  }
};

/* ------------------------------------------------------------- routes --- */
const NAV = [
  { group:null, items:[ ["overview","Overview","▤"] ] },
  { group:"Model lifecycle", items:[ ["models","Models","◫"], ["experiments","Experiments","⌗"],
      ["deployments","Deployments","⇪"] ] },
  { group:"Observability", items:[ ["monitoring","Monitoring","◴"], ["drift","Drift","∿"],
      ["retraining","Retraining","⟳"] ] },
  { group:"Model governance", items:[ ["champion","Champion / Challenger","⚖"],
      ["audit","Audit Logs","☰"] ] },
  { group:"LLMOps", items:[ ["llm-overview","Overview","◇"], ["llm-prompts","Prompts","¶"],
      ["llm-evals","Evaluations","✓"], ["llm-cost","Tokens & Cost","$"],
      ["llm-safety","Safety","⛨"] ] },
  { group:"System", items:[ ["system","System Health","♥"], ["__docs","API Docs","↗"] ] },
];

function buildNav(){
  const cur = route();
  $("#nav").innerHTML = NAV.map(sec =>
    (sec.group ? `<div class="navgrp">${esc(sec.group)}</div>` : "") +
    sec.items.map(([id,label,icon]) => id === "__docs"
      ? `<a class="navlink" href="/docs" target="_blank" rel="noopener">
           <span class="ico">${icon}</span>${esc(label)}</a>`
      : `<a class="navlink ${id===cur?"on":""}" href="#/${id}">
           <span class="ico">${icon}</span>${esc(label)}</a>`).join("")
  ).join("");
}
function route(){
  const r = (location.hash || "#/overview").replace(/^#\//,"").split("?")[0];
  return PAGES[r] ? r : "overview";
}

let refreshTimer = null;
async function render(){
  const id = route(), page = PAGES[id];
  buildNav();
  $("#crumb").textContent = page.title;
  document.title = `${page.title} · FMOps Platform`;
  const view = $("#view");
  view.innerHTML = `<div class="phead"><h1>${esc(page.title)}</h1>
    <p>${esc(page.intro||"")}</p></div>` + skeleton(6);

  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }

  let html;
  try { html = await page.render(); }
  catch(e){ html = errorState(e.message || String(e), id); }
  if(route() !== id) return;                       // navigated away mid-load
  view.innerHTML = `<div class="phead"><h1>${esc(page.title)}</h1>
    <p>${esc(page.intro||"")}</p></div>` + html;

  /* Auto-refresh only where it is genuinely useful, only while the tab is
     visible, and never faster than the backend sampling interval. */
  if(page.refresh){
    refreshTimer = setInterval(() => {
      if(document.visibilityState === "visible" && route() === id){ api.bust(); render(); }
    }, page.refresh);
  }
  wirePage();
}

function wirePage(){
  document.querySelectorAll("[data-retry]").forEach(b =>
    b.onclick = () => { api.bust(); render(); });

  const q = $("#auditq"), sel = $("#auditact");
  if(q){
    const apply = () => {
      const term = (q.value||"").toLowerCase(), act = sel.value;
      const rows = (window.__audit||[]).filter(e => {
        if(act && e.action !== act) return false;
        if(!term) return true;
        return JSON.stringify(e).toLowerCase().includes(term);
      });
      $("#audittbl").innerHTML = auditTable(rows);
      $("#auditcount").textContent = `${rows.length} of ${(window.__audit||[]).length} entries`;
    };
    q.oninput = apply; sel.onchange = apply;
  }

  const rb = document.querySelector('[data-act="rollback"]');
  if(rb) rb.onclick = () => runAction({
    title:"Roll back deployment",
    body:"This restores the previous model version as the serving version. It changes what production traffic is scored by.",
    confirm:"Roll back", danger:true, needsKey:true,
    path:"/api/v1/deployments/rollback", payload:{ reason:"manual rollback from console" },
    success:"Rollback requested." });

  document.querySelectorAll('[data-act="promote"]').forEach(b => b.onclick = () => runAction({
    title:`Promote v${b.dataset.ver} to Production`,
    body:"The registry stage machine and the approval gate still apply — this request can be rejected by the backend.",
    confirm:"Promote", needsKey:true,
    path:`/api/v1/models/${encodeURIComponent(b.dataset.model)}/versions/${encodeURIComponent(b.dataset.ver)}/stage`,
    payload:{ stage:"Production" }, success:"Stage transition requested." }));

  document.querySelectorAll('[data-act="ack"]').forEach(b => b.onclick = () => runAction({
    title:"Acknowledge alert",
    body:"Marks this alert as acknowledged. It stays in the history.",
    confirm:"Acknowledge", needsKey:true,
    path:`/api/v1/alerts/${encodeURIComponent(b.dataset.id)}/acknowledge`,
    success:"Alert acknowledged." }));
}

/* ------------------------------------------------------------- header --- */
async function header(){
  try {
    const d = await api.get("/api/v1/dashboard", 20000);
    const svc = d.service || {}, sys = d.system || {};
    $("#envbadge").innerHTML = badge(String(svc.environment||"unknown").toUpperCase(), "info");
    const ok = sys.latency_slo_met !== false && sys.error_slo_met !== false;
    $("#healthbadge").innerHTML = badge(ok ? "Healthy" : "Degraded", ok ? "ok" : "warn", true);
  } catch(e){
    $("#envbadge").innerHTML = "";
    $("#healthbadge").innerHTML = badge("API unreachable","bad",true);
  }
}

/* --------------------------------------------------------------- boot --- */
(function boot(){
  const saved = localStorage.getItem("fmops-theme");   // a UI preference, not data
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  $("#theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("fmops-theme", next); } catch(e){ /* private mode */ }
  };
  $("#refresh").onclick = () => { api.bust(); render(); header(); toast("Reloaded."); };
  $("#burger").onclick = () => $("#side").classList.toggle("open");
  $("#nav").addEventListener("click", e => {
    if(e.target.closest(".navlink")) $("#side").classList.remove("open"); });
  window.addEventListener("hashchange", render);
  if(!location.hash) location.hash = "#/overview";
  render(); header();
  setInterval(header, 30000);
})();
</script>
</body>
</html>
