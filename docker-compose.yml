# Local FMOps stack.
#
#   docker compose up -d          bring up API, MLflow, Prometheus, Grafana, MinIO
#   docker compose --profile bootstrap up bootstrap   generate data + train + promote
#   docker compose logs -f api
#   docker compose down -v        tear down including volumes
#
# Everything here runs offline. AWS is not required and not contacted.
#
#   API + dashboard  http://localhost:8000/dashboard
#   API docs         http://localhost:8000/docs
#   MLflow           http://localhost:5000
#   Prometheus       http://localhost:9090
#   Grafana          http://localhost:3000   (admin / admin by default)
#   MinIO console    http://localhost:9001   (S3-compatible, exercises the S3 path)

name: fmops

x-common-env: &common-env
  FMOPS_ENV: development
  FMOPS_LOG_FORMAT: json
  FMOPS_LOG_LEVEL: INFO
  FMOPS_TRACKING__TRACKING_URI: http://mlflow:5000
  FMOPS_TRACKING__REGISTRY_BACKEND: mlflow
  FMOPS_PATHS__ARTIFACTS_DIR: /app/artifacts
  FMOPS_PATHS__DATA_DIR: /app/data
  # Secrets are read from the host environment only; never baked into the image.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: fmops/api:local
    container_name: fmops-api
    environment:
      <<: *common-env
      FMOPS_SERVER__WORKERS: "2"
    ports:
      - "8000:8000"
    volumes:
      - fmops-artifacts:/app/artifacts
      - fmops-data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
    # Non-root, no privilege escalation, and only the writable paths it needs.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # One-shot: generate the datasets, train, promote and deploy so the stack has
  # something to serve. Run explicitly with `--profile bootstrap`.
  bootstrap:
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    image: fmops/training:local
    container_name: fmops-bootstrap
    profiles: ["bootstrap"]
    environment: *common-env
    volumes:
      - fmops-artifacts:/app/artifacts
      - fmops-data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    # NOT `-lc`. A login shell sources /etc/profile, which resets PATH and
    # drops /opt/venv/bin -- the image's only Python with dependencies
    # installed. `bash -lc "python ..."` inside this image fails with
    # ModuleNotFoundError: No module named 'yaml'.
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "python -m app.cli data generate &&
       python -m pipelines.training_pipeline --promote --report /app/artifacts/reports/bootstrap.json &&
       python -m pipelines.deployment_pipeline --strategy blue_green &&
       python -m app.cli status"

  # Scheduled retraining check. Kept as a profile so it never runs by accident.
  retrainer:
    image: fmops/training:local
    container_name: fmops-retrainer
    profiles: ["retraining"]
    environment: *common-env
    volumes:
      - fmops-artifacts:/app/artifacts
      - fmops-data:/app/data
    entrypoint: ["python", "-m", "pipelines.retraining_pipeline"]
    command: ["--report", "/app/artifacts/reports/retraining.json"]
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: fmops-mlflow
    ports:
      - "5000:5000"
    volumes:
      - fmops-mlflow:/mlflow
    # SQLite backend store + local artifact root. Production swaps the
    # backend-store-uri for RDS and the artifact root for S3; nothing else
    # about the platform changes.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: fmops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - fmops-prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: fmops-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fmops-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # S3-compatible object storage. Optional, but it lets the S3ArtifactStore code
  # path be exercised locally rather than only asserted about.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: fmops-minio
    profiles: ["s3"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-fmopsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fmopsadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - fmops-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  fmops-artifacts:
  fmops-data:
  fmops-mlflow:
  fmops-prometheus:
  fmops-grafana:
  fmops-minio:
